<nav class="navbar">
  <div class="nav-brand" routerLink="/dashboard">
    ⏰ TimeBank
  </div>
  <div class="nav-links">
    <a routerLink="/dashboard">Home</a>
    <a routerLink="/requests">Requests</a>
    <a routerLink="/sessions">Sessions</a>
    <a routerLink="/profile">Profile</a>
